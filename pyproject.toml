[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-antifraud"
version = "0.1.0"
description = "Explainable metadata-only telecom antifraud demonstrator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "scikit-learn>=1.5,<2", "networkx>=3.3,<4", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["antifraud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
